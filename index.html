<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-black: #1a1a1a;
            --cinnabar: #d92d20;
            --bg-color: #fdfdfd;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-color);
            overflow-x: hidden;
            height: 100vh;
            color: var(--ink-black);
            transition: background 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .font-brush { font-family: 'Zhi Mang Xing', cursive; }

        #ink-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .nav-active {
            color: var(--ink-black);
            font-weight: 900;
            position: relative;
        }
        .nav-active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--cinnabar);
            border-radius: 50%;
        }

        #main-compass {
            width: 65vw;
            height: 65vw;
            max-width: 280px;
            max-height: 280px;
        }

        .calculating {
            animation: compassSpin 2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes compassSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(1440deg); }
        }

        .seal {
            width: 50px; height: 50px;
            border: 2px solid var(--cinnabar);
            color: var(--cinnabar);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            transform: rotate(-15deg);
        }

        .vert-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .wiki-section-header {
            border-left: 3px solid var(--ink-black);
            padding-left: 1rem;
            margin: 2rem 0 1rem 0;
        }

        .view-container {
            height: 100vh;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        /* 辟谣项样式 */
        .rumor-card {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 1rem 0;
        }
        .rumor-q {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }
        .rumor-a {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-out;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .rumor-card.active .rumor-a {
            max-height: 300px;
            margin-top: 10px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .rumor-card.active .chevron {
            transform: rotate(180deg);
        }
    </style>
</head>

        // Initialize App
        let currentSelected = null;
        const canvas = document.getElementById('ink-canvas');
        const ctx = canvas.getContext('2d');

        function init() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            // Build Compass Marks
            const compass = document.getElementById('main-compass');
            for(let i=0; i<12; i++) {
                const el = document.createElement('div');
                el.className = 'absolute text-[9px] font-bold text-gray-400';
                el.style.transform = `rotate(${i * 30}deg) translateY(-110px)`;
                el.innerText = SHICHENS[i];
                compass.appendChild(el);
            }

            // Build Wiki Content
            const wikiContainer = document.getElementById('wiki-main-content');
            WIKI_CONTENT.forEach(item => {
                const div = document.createElement('div');
                div.className = 'mb-12';
                div.innerHTML = `
                    <div class="wiki-section-header">
                        <h4 class="text-xl font-black">${item.title}</h4>
                        <p class="text-[10px] text-gray-400 tracking-widest">${item.subtitle}</p>
                    </div>
                    <p class="text-xs leading-relaxed mb-4 text-gray-600">${item.content}</p>
                    <div class="bg-gray-100/50 p-5 rounded-2xl border-l-4 border-black">
                        <p class="text-[11px] font-bold mb-2">${item.example}</p>
                        <p class="text-[10px] leading-relaxed opacity-70">${item.details}</p>
                    </div>
                `;
                wikiContainer.appendChild(div);
            });

            // Build Rumors
            const rumorList = document.getElementById('rumor-list');
            RUMORS.forEach((r, idx) => {
                const div = document.createElement('div');
                div.className = 'rumor-card';
                div.innerHTML = `
                    <div class="rumor-q" onclick="toggleRumor(this)">
                        <span>❓ ${r[0]}</span>
                        <svg class="chevron w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div class="rumor-a">💡 ${r[1]}</div>
                `;
                rumorList.appendChild(div);
            });

            // Build Community
            const threads = document.getElementById('threads-container');
            THREADS.forEach(t => {
                const card = document.createElement('div');
                card.style.backgroundColor = t.color;
                card.className = 'p-6 rounded-3xl shadow-sm border border-black/5';
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center font-brush text-lg border border-black/10">${t.user[0]}</div>
                        <div>
                            <p class="text-[11px] font-black">${t.user}</p>
                            <p class="text-[8px] opacity-40">来自 华夏大地</p>
                        </div>
                    </div>
                    <p class="text-xs leading-relaxed text-gray-700">${t.content}</p>
                `;
                threads.appendChild(card);
            });

            updateClock();
            setInterval(updateClock, 1000);
            animateInk();
        }

        // Interaction Logic
        function toggleRumor(el) {
            const card = el.parentElement;
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.rumor-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
        }

        function switchView(v) {
            ['diag', 'wiki', 'comm'].forEach(id => {
                const el = document.getElementById(`view-${id}`);
                const nav = document.getElementById(`nav-${id}`);
                el.classList.add('hidden', 'opacity-0');
                nav.classList.remove('nav-active');
                nav.classList.add('text-gray-400');
            });
            const target = document.getElementById(`view-${v}`);
            target.classList.remove('hidden');
            setTimeout(() => target.classList.remove('opacity-0'), 50);
            document.getElementById(`nav-${v}`).classList.add('nav-active');
            document.getElementById(`nav-${v}`).classList.remove('text-gray-400');
        }

        function selectEmotion(type, color) {
            currentSelected = type;
            document.body.style.backgroundColor = color;
            document.getElementById('btn-submit').classList.remove('hidden');
            document.querySelectorAll('[id^="icon-"]').forEach(el => {
                el.classList.remove('scale-125', 'border-black', 'border-2');
                el.classList.add('border-black/5');
            });
            const active = document.getElementById(`icon-${type}`);
            active.classList.remove('border-black/5');
            active.classList.add('scale-125', 'border-black', 'border-2');
        }

        function startDiagnosis() {
            const overlay = document.getElementById('thinking-overlay');
            const status = document.getElementById('thinking-status');
            overlay.classList.remove('hidden');
            const steps = ["审五志", "辨时辰", "观五行", "定经络", "取良方"];
            let i = 0;
            const timer = setInterval(() => {
                status.innerText = steps[i % steps.length];
                i++;
            }, 600);
            setTimeout(() => {
                clearInterval(timer);
                overlay.classList.add('hidden');
                showResult();
            }, 3200);
        }

        function showResult() {
            const data = EMOTIONS[currentSelected];
            const now = new Date();
            document.getElementById('res-title').innerText = data.title;
            document.getElementById('res-date').innerText = now.getFullYear() + "." + (now.getMonth()+1) + "." + now.getDate();
            
            const body = document.getElementById('res-body');
            body.innerHTML = `
                <div class="bg-gray-50 p-6 rounded-2xl border-l-4 border-black">
                    <h5 class="text-[11px] font-black text-red-700 mb-2">【病理溯源】</h5>
                    <p class="text-[11px] leading-relaxed italic text-gray-600">${data.science}</p>
                </div>
                <div class="grid grid-cols-1 gap-6">
                    ${[['食·归经', data.food], ['息·吐纳', data.breath], ['动·经穴', data.move], ['静·守神', data.still]].map(item => `
                        <div class="border-b border-black/5 pb-2">
                            <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">${item[0]}</p>
                            <p class="text-lg font-serif font-black">${item[1]}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="p-4 bg-red-50 text-[10px] text-red-800 leading-relaxed rounded-xl">
                    <strong>提示：</strong>${data.caution}
                </div>
            `;
            document.getElementById('stage-result').classList.remove('hidden');
        }

        function closeResult() { document.getElementById('stage-result').classList.add('hidden'); }

        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            document.getElementById('nav-time').innerText = now.toTimeString().split(' ')[0];
            const idx = Math.floor(((h + 1) % 24) / 2);
            const mainCompass = document.getElementById('main-compass');
            if (mainCompass) mainCompass.style.transform = `rotate(${-(idx * 30)}deg)`;
        }

        // Ink Animation
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function animateInk() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            if(particles.length < 20) particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                s: Math.random() * 60 + 20,
                o: Math.random() * 0.05,
                vx: (Math.random()-0.5)*0.3,
                vy: (Math.random()-0.5)*0.3
            });
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
                ctx.fillStyle = `rgba(0,0,0,${p.o})`;
                ctx.fill();
            });
            requestAnimationFrame(animateInk);
        }

        window.onload = init;
    </script>
</body>
</html>
